# Football Predictor behind a login. setup.sh fills in __DOMAIN__; certbot then adds HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Only people with a login (deploy/friends.sh) get in.
    auth_basic "Football Predictor";
    auth_basic_user_file /etc/nginx/predictor.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # Streamlit runs over a websocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User $remote_user;  # login name: each person's own bet log
        proxy_read_timeout 86400;
    }
}
